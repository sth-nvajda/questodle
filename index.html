<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Quests</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.0.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.0.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Courier+Prime:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Courier Prime', 'Courier New', monospace; }

  .theme-day {
    --bg: #eae2c8;
    --bg-dot: #dccfa2;
    --ink: #362e22;
    --ink-soft: #6b6152;
    --stone-dark: #6b6455;
    --moss: #6b7f5b;
    --moss-dark: #4f5f44;
    --clay: #b5502e;
    --card-bg: #f4eeda;
    --card-border: #c9bb92;
    --shadow: rgba(54,46,34,0.18);
    --hill-far: #cdd6b3;
    --hill-mid: #a3b78a;
    --hill-near: #74895f;
    --bush: #566b47;
    --bamboo: #8a9d5e;
    --bamboo-dark: #6f8049;
    --sun: #f2b74e;
    --sun-glow: rgba(242,183,78,0.35);
  }
  .theme-night {
    --bg: #182019;
    --bg-dot: #101611;
    --ink: #e4dab8;
    --ink-soft: #a99f85;
    --stone-dark: #313d34;
    --moss: #8fa37e;
    --moss-dark: #6e8560;
    --clay: #d9835a;
    --card-bg: #202b23;
    --card-border: #3b4a3e;
    --shadow: rgba(0,0,0,0.55);
    --hill-far: #263229;
    --hill-mid: #1c2a20;
    --hill-near: #121e16;
    --bush: #0f1a13;
    --bamboo: #3c4c33;
    --bamboo-dark: #293522;
    --moon: #efe7c9;
    --moon-glow: rgba(239,231,201,0.18);
  }

  .page {
    min-height: 100vh;
    background-color: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, var(--bg-dot) 1.4px, transparent 0);
    background-size: 24px 24px;
    color: var(--ink);
    transition: background-color 0.5s ease, color 0.5s ease;
    padding-bottom: 3rem;
  }

  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  a:focus-visible, button:focus-visible {
    outline: 2px dashed var(--clay);
    outline-offset: 3px;
  }

  .frame { max-width: 780px; margin: 0 auto; padding: 1.5rem 1rem 0; position: relative; z-index: 1; }

  .backdrop {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }
  .backdrop svg { width: 100%; height: 100%; display: block; }
  .hill-far { fill: var(--hill-far); transition: fill 0.5s ease; }
  .hill-mid { fill: var(--hill-mid); transition: fill 0.5s ease; }
  .hill-near { fill: var(--hill-near); transition: fill 0.5s ease; }
  .bush-shape { fill: var(--bush); transition: fill 0.5s ease; }
  .bamboo-stalk { fill: var(--bamboo); transition: fill 0.5s ease; }
  .bamboo-node { stroke: var(--bamboo-dark); transition: stroke 0.5s ease; }
  .bamboo-leaf { fill: var(--bamboo-dark); transition: fill 0.5s ease; }
  .moon-cut { fill: var(--bg); transition: fill 0.5s ease; }
  .inner-border {
    border: 3px double var(--stone-dark);
    padding: 1.75rem 1.5rem 2.5rem;
    background: var(--card-bg);
    box-shadow: 0 6px 18px var(--shadow);
  }

  /* ---- hero ---- */
  .hero { text-align: center; }
  .bonsai-img {
    width: 140px;
    height: 140px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    margin: 0 auto 0.5rem;
    display: block;
  }
  h1.title {
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 2.2rem;
    margin: 0.4rem 0 0.15rem;
    letter-spacing: 0.02em;
  }
  .tagline {
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin: 0 0 1.2rem;
  }
  .subtitle-jp {
    font-family: 'Shippori Mincho', serif;
    color: var(--moss);
    font-size: 1rem;
    margin: 0 0 0.2rem;
  }

  .toggle-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--bg);
    color: var(--ink);
    border: 2px solid var(--stone-dark);
    border-radius: 999px;
    padding: 0.5rem 1.2rem;
    font-size: 0.9rem;
    transition: transform 0.25s ease;
  }
  .toggle-btn:hover { transform: scale(1.04); background: var(--card-border); }

  /* ---- categories ---- */
  .category { margin-top: 2.25rem; }
  .category-head {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    margin-bottom: 1rem;
    border-bottom: 1px dashed var(--card-border);
    padding-bottom: 0.5rem;
  }
  .category-emoji { font-size: 1.6rem; }
  .category-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.35rem;
    font-weight: 600;
    margin: 0;
  }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 0.9rem;
  }
  .game-tile {
    position: relative;
    display: block;
    text-decoration: none;
    background: var(--bg);
    border: 1px dashed var(--card-border);
    padding: 0.9rem 1rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .game-tile:nth-child(3n) { transform: rotate(-0.6deg); }
  .game-tile:nth-child(3n+1) { transform: rotate(0.5deg); }
  .game-tile:nth-child(3n+2) { transform: rotate(-0.2deg); }
  .game-tile:hover {
    transform: rotate(0deg) translateY(-3px);
    box-shadow: 0 6px 14px var(--shadow);
    border-color: var(--moss);
    border-style: solid;
  }
  .game-tile-inner { display: flex; align-items: center; gap: 0.7rem; }
  .game-emoji { font-size: 1.7rem; }
  .game-name { font-weight: 700; font-size: 1.02rem; margin: 0; }

  .badge-new {
    position: absolute;
    top: -9px;
    right: -8px;
    background: var(--clay);
    color: #fff8ec;
    font-family: 'VT323', monospace;
    font-size: 0.95rem;
    padding: 0.05rem 0.5rem;
    border: 1px solid var(--ink);
    transform: rotate(6deg);
  }
  .blink { animation: blink-op 1.4s steps(1) infinite; }
  @keyframes blink-op { 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) {
    .blink { animation: none !important; opacity: 1 !important; }
  }

  @media (max-width: 480px) {
    h1.title { font-size: 1.75rem; }
    .inner-border { padding: 1.25rem 1rem 1.5rem; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const BackdropGarden = ({ theme }) => (
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    {theme === 'day' ? (
      <g>
        <circle cx="1180" cy="150" r="72" fill="var(--sun-glow)" />
        <circle cx="1180" cy="150" r="42" fill="var(--sun)" />
      </g>
    ) : (
      <g>
        <circle cx="1180" cy="150" r="80" fill="var(--moon-glow)" />
        <circle cx="1180" cy="150" r="40" fill="var(--moon)" />
        <circle cx="1197" cy="137" r="34" className="moon-cut" />
        <circle cx="1075" cy="110" r="2.4" fill="var(--moon)" opacity="0.8" />

              {theme === 'day' ? 'Moonlit Garden' : 'Day Garden'}
            </button>
          </div>

          {games.map((category, index) => (
            <div className="category" key={index}>
              <div className="category-head">
                <span className="category-emoji">{category.emoji}</span>
                <h2 className="category-title">{category.category}</h2>
              </div>
              <div className="game-grid">

                    key={gameIndex}
                    href={game.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="game-tile"

</body>
</html>
